# Isolated in-memory H2 remains the default for automated tests.
# Use the postgres-test profile for integration verification with V1-V4 migrations.
spring.datasource.url=jdbc:h2:mem:caresync_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
