# Explicit opt-in profile for integration tests against a dedicated PostgreSQL test database.
# Credentials are required from the process environment; never place them in source files.
spring.datasource.url=${CARESYNC_TEST_DB_URL}
spring.datasource.username=${CARESYNC_TEST_DB_USERNAME}
spring.datasource.password=${CARESYNC_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# V1-V4 own the test schema. Hibernate only checks their mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
