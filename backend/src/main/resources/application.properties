# CareSync Hospital Management System - Backend Configuration
spring.application.name=caresync-backend
server.port=8080

# Database Configuration (H2 in-memory default for development)
spring.datasource.url=jdbc:h2:mem:caresyncdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Origins must be an explicit comma-separated list (for example: http://localhost:5173).
# An empty list disables cross-origin browser access. Never use '*'.
caresync.security.cors.allowed-origins=${CARESYNC_CORS_ALLOWED_ORIGINS:}

# Bound request headers and form/multipart bodies; set a matching JSON body limit at the gateway.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.caresync.backend=INFO

# Supply a unique random secret (at least 32 bytes) through CARESYNC_JWT_SECRET.
caresync.security.jwt-secret=${CARESYNC_JWT_SECRET:}
caresync.bootstrap.username=${CARESYNC_BOOTSTRAP_USERNAME:}
caresync.bootstrap.password=${CARESYNC_BOOTSTRAP_PASSWORD:}
caresync.bootstrap.full-name=${CARESYNC_BOOTSTRAP_FULL_NAME:Platform Administrator}

