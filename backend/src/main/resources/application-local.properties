# Local PostgreSQL 17 only. Credentials must be provided in the process environment.
spring.datasource.url=${CARESYNC_DB_URL:jdbc:postgresql://127.0.0.1:5432/caresync}
spring.datasource.username=${CARESYNC_DB_USERNAME:postgres}
spring.datasource.password=${CARESYNC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
