name: hospital_management
description: "Hospital Management System – offline-first, cross-platform Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management & DI ───────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Database (drift + sqlite) ────────────────────────────────────────────────
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Secure storage & Encryption ──────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # ── PDF & Printing ───────────────────────────────────────────────────────────
  pdf: ^3.10.8
  printing: ^5.13.1

  # ── Charts & Visuals ─────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Export & Utilities ───────────────────────────────────────────────────────
  csv: ^6.0.0
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.7

  # ── UI Helpers ───────────────────────────────────────────────────────────────
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
