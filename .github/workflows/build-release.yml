name: Build & Release Multi-Platform

on:
  push:
    branches:
      - main
      - Saurabh
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Manual Version Tag override (e.g. v1.0.0). Leave empty for auto-increment.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 1. Semantic Version Tag Manager ─────────────────────────────────────────
  version:
    name: Calculate & Tag Next Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
      version_number: ${{ steps.calc_version.outputs.version_number }}
      build_number: ${{ steps.calc_version.outputs.build_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Next Semantic Version
        id: calc_version
        run: |
          echo "Fetching all remote git tags..."
          git fetch --tags --force

          MANUAL_VERSION="${{ github.event.inputs.custom_version }}"

          if [ -n "$MANUAL_VERSION" ]; then
            TAG="$MANUAL_VERSION"
            echo "Using manually specified version tag: $TAG"
            ALREADY_TAGGED=false
          else
            # Check if current HEAD commit is already tagged
            CURRENT_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | head -n 1)

            if [ -n "$CURRENT_TAG" ]; then
              echo "Current commit already tagged with $CURRENT_TAG. Reusing tag."
              TAG="$CURRENT_TAG"
              ALREADY_TAGGED=true
            else
              LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
              echo "Latest existing tag found: '$LATEST_TAG'"

              if [ -z "$LATEST_TAG" ]; then
                TAG="v0.0.1"
                echo "No valid semantic version tag found. Defaulting to baseline $TAG"
              else
                RAW="${LATEST_TAG#v}"
                MAJOR=$(echo "$RAW" | cut -d. -f1)
                MINOR=$(echo "$RAW" | cut -d. -f2)
                PATCH=$(echo "$RAW" | cut -d. -f3)
                NEW_PATCH=$((PATCH + 1))
                TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
                echo "Incremented patch version from $LATEST_TAG to $TAG"
              fi
              ALREADY_TAGGED=false
            fi
          fi

          # Ensure uniqueness & handle remote race conditions
          while true; do
            while [ "$ALREADY_TAGGED" = "false" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
              echo "Tag $TAG already exists locally. Incrementing..."
              RAW="${TAG#v}"
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)
              NEW_PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            done

            if [ "$ALREADY_TAGGED" = "false" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              if git push origin "$TAG"; then
                echo "Created and pushed new version tag: $TAG"
                break
              else
                echo "Tag push for $TAG rejected by remote. Re-fetching remote tags and incrementing..."
                git tag -d "$TAG" || true
                git fetch --tags --force
                RAW="${TAG#v}"
                MAJOR=$(echo "$RAW" | cut -d. -f1)
                MINOR=$(echo "$RAW" | cut -d. -f2)
                PATCH=$(echo "$RAW" | cut -d. -f3)
                NEW_PATCH=$((PATCH + 1))
                TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              fi
            else
              break
            fi
          done

          VER_NUM="${TAG#v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "version_number=$VER_NUM" >> $GITHUB_OUTPUT
          echo "build_number=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

  # ── 2. Web Build Job ────────────────────────────────────────────────────────
  build-web:
    name: Build Web Application
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Web (Release Mode)
        run: |
          flutter build web --release \
            --build-name=${{ needs.version.outputs.version_number }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Package Web Distribution
        run: |
          cd build/web
          zip -r "../../web-${{ needs.version.outputs.version }}.zip" .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: frontend/web-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  # ── 3. Android Build Job (APK & AAB) ────────────────────────────────────────
  build-android:
    name: Build Android Application (APK & AAB)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Configure Android Code Signing (if Secrets provided)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          else
            echo "::notice::Android signing secrets not configured. Building release package with default configuration."
          fi

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.version_number }} \
            --build-number=${{ needs.version.outputs.build_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "android-${{ needs.version.outputs.version }}.apk"

      - name: Build Android App Bundle (Release AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.version_number }} \
            --build-number=${{ needs.version.outputs.build_number }}
          cp build/app/outputs/bundle/release/app-release.aab "android-${{ needs.version.outputs.version }}.aab"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            frontend/android-${{ needs.version.outputs.version }}.apk
            frontend/android-${{ needs.version.outputs.version }}.aab
          if-no-files-found: error

  # ── 4. iOS Build Job (IPA) ──────────────────────────────────────────────────
  build-ios:
    name: Build iOS Application (IPA)
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build iOS Application & Package IPA
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]; then
            echo "Configuring Apple code signing from GitHub Secrets..."
            flutter build ipa --release \
              --build-name=${{ needs.version.outputs.version_number }} \
              --build-number=${{ needs.version.outputs.build_number }}
            cp build/ios/ipa/*.ipa "ios-${{ needs.version.outputs.version }}.ipa"
          else
            echo "::notice::Apple code-signing credentials (APPLE_CERTIFICATE_BASE64 / PROVISIONING_PROFILE) are unavailable in GitHub Secrets. Building release bundle without codesign and packaging into IPA."
            flutter build ios --release --no-codesign \
              --build-name=${{ needs.version.outputs.version_number }} \
              --build-number=${{ needs.version.outputs.build_number }}
            mkdir -p Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r "ios-${{ needs.version.outputs.version }}.ipa" Payload
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: frontend/ios-${{ needs.version.outputs.version }}.ipa
          if-no-files-found: error

  # ── 5. macOS Build Job (DMG) ────────────────────────────────────────────────
  build-macos:
    name: Build macOS Application (DMG)
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build macOS Application (Release)
        run: |
          flutter build macos --release \
            --build-name=${{ needs.version.outputs.version_number }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Create macOS DMG Distribution Package
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: macOS .app bundle not found in build directory."
            exit 1
          fi
          echo "Found application bundle at $APP_PATH. Creating DMG..."
          hdiutil create -volname "CareSync" -srcfolder "$APP_PATH" -ov -format UDZO "macos-${{ needs.version.outputs.version }}.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: frontend/macos-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  # ── 6. Linux Build Job (DEB, ZIP & AppImage) ─────────────────────────────────
  build-linux:
    name: Build Linux Application (DEB, ZIP & AppImage)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Linux Application (Release)
        run: |
          export CXXFLAGS="$CXXFLAGS -Wno-deprecated-literal-operator -Wno-error=deprecated-literal-operator -Wno-error"
          flutter build linux --release \
            --build-name=${{ needs.version.outputs.version_number }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Package Linux ZIP Distribution
        run: |
          cd build/linux/x64/release/bundle
          zip -r "../../../../../linux-${{ needs.version.outputs.version }}.zip" .
          cd ../../../../..

      - name: Package Linux Debian (.deb) Package
        run: |
          DEB_DIR="deb-pkg"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/caresync"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"

          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: caresync-hms
          Version: ${{ needs.version.outputs.version_number }}
          Section: medical
          Priority: optional
          Architecture: amd64
          Maintainer: CareSync Healthcare <support@caresync.health>
          Description: CareSync Hospital Management System - Offline-first cross-platform HMS built with Flutter.
          EOF

          cp -r build/linux/x64/release/bundle/* "$DEB_DIR/opt/caresync/"
          ln -s /opt/caresync/hospital_management "$DEB_DIR/usr/bin/caresync"

          cat << EOF > "$DEB_DIR/usr/share/applications/caresync.desktop"
          [Desktop Entry]
          Name=CareSync HMS
          Comment=CareSync Hospital Management System
          Exec=/usr/bin/caresync
          Icon=/opt/caresync/data/flutter_assets/assets/images/caresync_logo.png
          Terminal=false
          Type=Application
          Categories=Medical;Office;
          EOF

          dpkg-deb --build "$DEB_DIR" "linux-${{ needs.version.outputs.version }}.deb"

      - name: Package Linux AppImage (if tool available)
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/images/caresync_logo.png AppDir/caresync.png || true
          cp assets/images/caresync_logo.png AppDir/usr/share/icons/hicolor/256x256/apps/caresync.png || true

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/hospital_management" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/caresync.desktop
          [Desktop Entry]
          Name=CareSync HMS
          Exec=hospital_management
          Icon=caresync
          Type=Application
          Categories=Office;Medical;
          EOF

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ./appimagetool --appimage-extract-and-run AppDir "linux-${{ needs.version.outputs.version }}.AppImage" || true
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            frontend/linux-${{ needs.version.outputs.version }}.deb
            frontend/linux-${{ needs.version.outputs.version }}.zip
            frontend/linux-${{ needs.version.outputs.version }}.AppImage
          if-no-files-found: warn

  # ── 7. Windows Build Job (EXE Installer & ZIP) ──────────────────────────────
  build-windows:
    name: Build Windows Application (EXE & ZIP)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Flutter Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: |
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.version_number }} `
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Package Windows ZIP Distribution
        run: |
          $winDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$winDir\*" -DestinationPath "windows-${{ needs.version.outputs.version }}.zip"

      - name: Build Windows Distributable Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $winDir = (Get-Item "build\windows\x64\runner\Release").FullName
          $outDir = (Get-Item ".").FullName
          if (Test-Path $iscc) {
            & $iscc /DAppVersion="${{ needs.version.outputs.version_number }}" /DAppDir="$winDir" /O"$outDir" /F"windows-${{ needs.version.outputs.version }}" packaging\windows\inno_setup.iss
          } else {
            iscc /DAppVersion="${{ needs.version.outputs.version_number }}" /DAppDir="$winDir" /O"$outDir" /F"windows-${{ needs.version.outputs.version }}" packaging\windows\inno_setup.iss
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            frontend/windows-${{ needs.version.outputs.version }}.zip
            frontend/windows-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  # ── 8. Spring Boot Backend Build & Test Job ─────────────────────────────────
  build-backend:
    name: Build & Package Spring Boot Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Package with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests=false

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: backend/target/*.jar
          if-no-files-found: warn

  # ── 9. Unified Release Publishing (Mandatory Empty Description Policy) ─────
  release:
    name: Publish Multi-Platform GitHub Release
    needs:
      - version
      - build-web
      - build-android
      - build-ios
      - build-macos
      - build-linux
      - build-windows
      - build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate Release Artifact Inventory
        run: |
          echo "=== Downloaded Artifacts for Release ${{ needs.version.outputs.version }} ==="
          ls -lh release-assets/
          echo "Checking required platform files..."
          test -f release-assets/web-${{ needs.version.outputs.version }}.zip
          test -f release-assets/android-${{ needs.version.outputs.version }}.apk
          test -f release-assets/android-${{ needs.version.outputs.version }}.aab
          test -f release-assets/ios-${{ needs.version.outputs.version }}.ipa
          test -f release-assets/macos-${{ needs.version.outputs.version }}.dmg
          test -f release-assets/linux-${{ needs.version.outputs.version }}.zip
          test -f release-assets/linux-${{ needs.version.outputs.version }}.deb
          test -f release-assets/windows-${{ needs.version.outputs.version }}.zip
          echo "All required platform distribution packages verified successfully."

      - name: Publish GitHub Release (Strictly Empty Description Policy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing GitHub Release for tag ${{ needs.version.outputs.version }} with EMPTY description..."
          gh release create "${{ needs.version.outputs.version }}" \
            release-assets/* \
            --title "${{ needs.version.outputs.version }}" \
            --notes "" \
            --verify-tag
          echo "GitHub Release ${{ needs.version.outputs.version }} published with zero description text and all platform assets attached."
