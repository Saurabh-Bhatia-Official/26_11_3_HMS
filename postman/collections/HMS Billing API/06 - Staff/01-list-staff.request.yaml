$kind: http-request
name: List Staff
order: 1000
method: GET
url: '{{base_url}}/api/staff'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is a staff list", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });
