$kind: http-request
name: Get Staff by ID
order: 4000
method: GET
url: '{{base_url}}/api/staff/{{staff_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
