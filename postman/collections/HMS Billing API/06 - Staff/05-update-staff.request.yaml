$kind: http-request
name: Update Staff
order: 5000
method: PUT
url: '{{base_url}}/api/staff/{{staff_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Staff Updated",
      "gender": "Other",
      "phone": "9876543210",
      "role": "staff",
      "consultationFeePaise": 0,
      "followupFeePaise": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 and phone remains valid", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().phone).to.eql("9876543210");
      });
