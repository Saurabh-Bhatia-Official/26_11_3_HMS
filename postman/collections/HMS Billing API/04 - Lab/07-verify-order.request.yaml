$kind: http-request
name: 'Verify Lab Order'
order: 7000
method: POST
url: '{{base_url}}/api/lab/orders/{{lab_order_id}}/verify'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Order status is verified", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("status");
          pm.expect(jsonData.status).to.equal("verified");
      });
