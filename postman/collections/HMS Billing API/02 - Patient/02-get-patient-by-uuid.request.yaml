$kind: http-request
name: 'Get Patient by UUID'
order: 2000
method: GET
url: '{{base_url}}/api/patients/by-uuid/{{patient_uuid}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has patient fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("uuid");
          pm.expect(jsonData).to.have.property("uhid");
          pm.expect(jsonData).to.have.property("name");
      });
