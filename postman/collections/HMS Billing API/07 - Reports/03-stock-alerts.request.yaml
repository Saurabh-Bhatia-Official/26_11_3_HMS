$kind: http-request
name: Get Stock Alerts
order: 3000
method: GET
url: '{{base_url}}/api/reports/stock-alerts'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Stock alerts response is a list", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });
