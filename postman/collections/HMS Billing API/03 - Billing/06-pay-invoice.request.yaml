$kind: http-request
name: 'Pay Invoice'
order: 6000
method: POST
url: '{{base_url}}/api/billing/invoices/{{invoice_id}}/payments'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "paymentMode": "cash",
      "amountPaise": {{invoice_total_paise}},
      "referenceNo": "POSTMAN-PAY-001"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Invoice has payments array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("payments");
          pm.expect(jsonData.payments).to.be.an("array").and.have.length.above(0);
      });

      pm.test("Invoice paidPaise updated", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("paidPaise");
          pm.expect(jsonData.paidPaise).to.be.above(0);
      });
