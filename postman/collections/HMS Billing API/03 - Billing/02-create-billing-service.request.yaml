$kind: http-request
name: 'Create Billing Service'
order: 2000
method: POST
url: '{{base_url}}/api/billing/services'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "General Consultation",
      "category": "OPD",
      "pricePaise": 50000,
      "taxRatePct": 0.0,
      "active": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has id, name, pricePaise", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("name");
          pm.expect(jsonData).to.have.property("pricePaise");
      });

      var jsonData = pm.response.json();
      if (jsonData.id) {
          pm.collectionVariables.set("billing_service_id", String(jsonData.id));
      }
