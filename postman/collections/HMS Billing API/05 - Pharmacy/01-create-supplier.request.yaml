$kind: http-request
name: 'Create Supplier'
order: 1000
method: POST
url: '{{base_url}}/api/pharmacy/suppliers'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "MedSupply Co.",
      "contactPerson": "Ravi Kumar",
      "phone": "9876543210",
      "email": "ravi@medsupply.com",
      "address": "123 Pharma Street, Mumbai",
      "gstNo": "27AABCU9603R1ZX"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has supplier fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("name");
          pm.expect(jsonData).to.have.property("uuid");
      });

      var jsonData = pm.response.json();
      if (jsonData.id) {
          pm.collectionVariables.set("supplier_id", String(jsonData.id));
      }
